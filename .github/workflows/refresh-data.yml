name: refresh-data

on:
  schedule:
    # 每天 22:00 UTC（北京时间次日 06:00）刷新一次外部数据
    - cron: "0 22 * * *"
  # 也支持在 Actions 页面手动点 "Run workflow" 立即刷新
  workflow_dispatch: {}

# 需要写权限，才能把刷新后的数据 commit 回仓库
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh external data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # 抓取脚本只用 Node 内置模块 + 全局 fetch，无需 pnpm install
      - name: Fetch Steam data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node scripts/fetch-steam.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain src/data/)" ]]; then
            git add src/data/
            git commit -m "chore(data): 自动刷新外部数据"
            git push
          else
            echo "数据无变化，跳过提交"
          fi
